<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132e3b">
  <title>Rink Schedule · JSON Export</title>
  <style>
    :root { color-scheme: light; --ink: #163443; --muted: #5e737f; --line: #d7e3e6; --accent: #087f7a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f6f6; color: var(--ink); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .topbar { border-bottom: 1px solid var(--line); background: #fff; }
    .topbar-inner { max-width: 1020px; margin: auto; padding: 21px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: white; background: var(--ink); }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: var(--muted); }
    main { max-width: 860px; margin: 68px auto 45px; padding: 0 28px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
    h1 { font-size: clamp(32px, 5vw, 46px); line-height: 1.15; font-weight: 650; letter-spacing: -1.7px; margin: 0 0 18px; }
    .intro { color: var(--muted); max-width: 580px; margin: 0 0 30px; font-size: 17px; }
    .card { padding: 30px; border: 1px solid var(--line); background: #fff; border-radius: 16px; box-shadow: 0 5px 20px #16344304; }
    label { display: block; font-size: 14px; font-weight: 650; margin-bottom: 10px; }
    .input-row { display: flex; align-items: stretch; gap: 10px; }
    input { width: 100%; min-width: 0; background: #fafcfc; border: 1px solid #b9ccd1; border-radius: 8px; padding: 13px 14px; color: var(--ink); font: inherit; font-size: 14px; }
    input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #80c9c5; outline-offset: 3px; }
    button { border: 0; border-radius: 8px; background: var(--accent); color: #fff; padding: 12px 22px; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap; }
    button:hover { background: #066862; }
    button:disabled { cursor: wait; opacity: .65; }
    .help { margin: 10px 0 23px; color: var(--muted); font-size: 12px; }
    .facts { display: flex; gap: 26px; border-top: 1px solid #e8eeef; padding-top: 20px; font-size: 12px; color: var(--muted); }
    .facts strong { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }
    .status { margin: 20px 0 0; padding: 13px 16px; border: 1px solid var(--line); border-radius: 8px; background: #f5f9f9; font-size: 14px; }
    .status:empty { display: none; }
    .status[data-state="error"] { background: #fff2ef; color: #9d3529; border-color: #f1c8bf; }
    .status[data-state="loading"]::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 10px; border: 2px solid #b6d8d5; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .status[data-state="loading"]::before { animation: none; } }
    .results { margin-top: 22px; }
    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
    .result-head h2 { font-size: 19px; margin: 0; letter-spacing: -.4px; }
    .result-head p { font-size: 12px; color: var(--muted); margin: 3px 0 0; }
    details { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    summary { cursor: pointer; padding: 11px 15px; font-size: 13px; font-weight: 600; background: #f7fafa; }
    pre { font: 12px/1.8 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 0; padding: 18px; overflow-x: auto; background: #142d3b; color: #d8efed; max-height: 350px; }
    .note { margin: 23px 5px 0; font-size: 12px; color: var(--muted); }
    footer { margin-top: 32px; font-size: 11px; color: #71858c; letter-spacing: .2px; }
    [hidden] { display: none !important; }
    @media (max-width: 580px) { main { margin-top: 38px; padding: 0 18px; } .topbar-inner { padding: 16px 18px; } .tag { display: none; } .card { padding: 21px; } .input-row { flex-direction: column; } .facts { gap: 16px; flex-wrap: wrap; } .result-head { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="mark" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h3m2 0h3m-8 3h3"/></svg></span>Rink Schedule</div>
      <span class="tag">SCHEDULE → JSON</span>
    </div>
  </header>
  <main>
    <section class="card" aria-label="Export a schedule">
      <form id="scrape-form">
        <label for="schedule-url">Acuity scheduling link</label>
        <div class="input-row">
          <input id="schedule-url" name="url" type="url" required maxlength="2048" autocomplete="off" spellcheck="false" aria-describedby="url-help" value="https://app.acuityscheduling.com/schedule/abdd2b57/appointment/14752819/calendar/7377344">
          <button id="scrape-button" type="submit">Scrape schedule <span aria-hidden="true">↗</span></button>
        </div>
        <p class="help" id="url-help">Accepts app.acuityscheduling.com and Acuity .as.me schedule links.</p>
        <div class="facts">
          <div><strong>60 days ahead</strong>Starting today, through day 60</div>
          <div><strong>Local rink time</strong>Dates and times from the schedule</div>
          <div><strong>JSON export</strong>One record per event</div>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
    <section id="results" class="card results" aria-label="Export results" hidden>
      <div class="result-head">
        <div><h2 id="result-title">Your schedule is ready</h2><p id="result-description"></p></div>
        <button id="download-button" type="button">Download JSON <span aria-hidden="true">↓</span></button>
      </div>
      <details><summary id="preview-label">Preview first 5 events</summary><pre id="preview"></pre></details>
    </section>
  </main>
  <script>
    'use strict';
    const form = document.getElementById('scrape-form');
    const input = document.getElementById('schedule-url');
    const submit = document.getElementById('scrape-button');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    let events = null;
    let filename = '';

    function clearResults() {
      events = null;
      results.hidden = true;
    }
    input.addEventListener('input', () => { clearResults(); status.textContent = ''; });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      clearResults();
      submit.disabled = true;
      input.disabled = true;
      form.setAttribute('aria-busy', 'true');
      status.dataset.state = 'loading';
      status.textContent = 'Reading the schedule. This may take a minute…';
      // Append to the current function URL, including a function-name path prefix.
      const endpoint = new URL(window.location.href);
      endpoint.pathname = endpoint.pathname.replace(/\/$/, '') + '/scrape';
      endpoint.search = '';
      endpoint.hash = '';
      try {
        const response = await fetch(endpoint, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value.trim() }), signal: AbortSignal.timeout(170000),
        });
        const data = await response.json().catch(() => { throw new Error('The server returned an unexpected response. Please try again.'); });
        if (!response.ok) throw new Error(data.error || 'The schedule could not be loaded.');
        if (!Array.isArray(data.events)) throw new Error('The server returned an invalid schedule.');
        events = data.events;
        filename = `events-${new Date().toLocaleDateString('en-CA')}.json`;
        status.dataset.state = 'success';
        status.textContent = events.length ? `Found ${events.length} event${events.length === 1 ? '' : 's'}. Your JSON file is ready.` : 'No published events were found in this date window. You can download an empty JSON array.';
        document.getElementById('result-title').textContent = events.length ? 'Your schedule is ready' : 'No published events';
        document.getElementById('result-description').textContent = `${events.length} event${events.length === 1 ? '' : 's'} · ${filename}`;
        document.getElementById('preview-label').textContent = `Preview${events.length > 5 ? ' first 5 events' : ''}`;
        document.getElementById('preview').textContent = JSON.stringify(events.slice(0, 5), null, 2);
        results.hidden = false;
      } catch (error) {
        status.dataset.state = 'error';
        status.textContent = error.name === 'TimeoutError' ? 'The request timed out. Please try again.' : error.message === 'Failed to fetch' ? 'Could not reach the server. Check your connection and try again.' : error.message;
      } finally {
        submit.disabled = false;
        input.disabled = false;
        form.removeAttribute('aria-busy');
      }
    });

    document.getElementById('download-button').addEventListener('click', () => {
      if (!events) return;
      const blob = new Blob([JSON.stringify(events, null, 2) + '\n'], { type: 'application/json' });
      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = objectUrl;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    });
  </script>
</body>
</html>
